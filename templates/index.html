<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>🏠 House Price Prediction</h1>

        <p>Enter the house size to estimate its market price.</p>

        <form action="/predict" method="POST">

            <input
                type="number"
                name="size"
                placeholder="Enter house size (sq ft)"
                required
            >

            <button type="submit">
                Predict Price
            </button>

        </form>

        {% if prediction_text %}
            <div class="result">
                {{ prediction_text }}
            </div>
        {% endif %}

    </div>

</body>
</html>
